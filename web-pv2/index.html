<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web-PV2: 网页美术风格预设资源库 | Qwen 专题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <div class="hub-app">
    <!-- 侧边栏：预设列表与导航 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <defs>
              <linearGradient id="qwen_grad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#615CED"/>
                <stop offset="0.55" stop-color="#9B8CFF"/>
                <stop offset="1" stop-color="#00D4FF"/>
              </linearGradient>
            </defs>
            <circle cx="15" cy="15" r="10.5" stroke="url(#qwen_grad)" stroke-width="3.2" fill="none"/>
            <line x1="21.5" y1="21.5" x2="28.5" y2="28.5" stroke="url(#qwen_grad)" stroke-width="3.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Web-PV2</h1>
          <span class="badge">Qwen Vault</span>
        </div>
      </div>

      <div class="search-filter-box">
        <input type="text" id="presetSearch" placeholder="搜索风格、关键词或标签..." autocomplete="off">
        <div class="category-pills" id="categoryPills">
          <button class="pill active" data-cat="all">全部 (10)</button>
          <button class="pill" data-cat="future">前沿科技</button>
          <button class="pill" data-cat="art">人文东方</button>
          <button class="pill" data-cat="cyber">硬核极客</button>
        </div>
      </div>

      <div class="preset-nav-list" id="presetNavList">
        <!-- 动态生成 10 个预设项 -->
      </div>

      <div class="sidebar-footer">
        <div class="tip-box">
          <p>点击「复制大模型 Prompt」可直接给 Claude / GPT / Qwen 生成同款风格页面。</p>
        </div>
      </div>
    </aside>

    <!-- 主展示区：包含控制条与实时预览 Iframe -->
    <main class="main-stage">
      <!-- 顶部控制栏 -->
      <header class="top-bar">
        <div class="current-preset-info">
          <span class="preset-index" id="currentPresetIndex">01</span>
          <div>
            <h2 id="currentPresetTitle">墨海千问·文人水墨长卷</h2>
            <p id="currentPresetSubtitle">Ink Myriad Questions · Literati Scroll</p>
          </div>
        </div>

        <div class="viewport-controls">
          <button class="vp-btn active" data-vp="100%" title="桌面全宽视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span>桌面</span>
          </button>
          <button class="vp-btn" data-vp="768px" title="平板视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span>平板</span>
          </button>
          <button class="vp-btn" data-vp="390px" title="移动端视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span>手机</span>
          </button>
        </div>

        <div class="action-buttons">
          <button class="action-btn" id="viewSpecBtn" title="查看风格构成说明">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>风格规范</span>
          </button>
          <button class="action-btn primary" id="copyPromptBtn" title="复制用于大模型的系统级 Prompt">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>复制大模型 Prompt</span>
          </button>
          <a class="action-btn icon-only" id="openExternalBtn" target="_blank" title="在新标签页全屏打开">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </header>

      <!-- 实时预览区域 -->
      <div class="preview-container">
        <div class="iframe-wrapper" id="iframeWrapper">
          <iframe id="previewIframe" src="presets/01-ink-myriad-questions/index.html" frameborder="0"></iframe>
        </div>
      </div>
    </main>

    <!-- 侧滑抽屉：风格构成说明 (style-spec) 模态框 -->
    <div class="spec-drawer-backdrop" id="specBackdrop"></div>
    <div class="spec-drawer" id="specDrawer">
      <div class="drawer-header">
        <div class="drawer-title-box">
          <h3 id="specTitle">风格构成说明 (Style Spec)</h3>
          <span id="specSubtitle" class="drawer-sub">01-ink-myriad-questions</span>
        </div>
        <button class="drawer-close-btn" id="drawerCloseBtn">&times;</button>
      </div>
      <div class="drawer-body" id="specContent">
        <!-- 动态加载并渲染 markdown 内容 -->
      </div>
    </div>

    <!-- 消息浮动提示 (Toast) -->
    <div class="toast" id="toast">已成功复制该风格的大模型 Prompt！</div>
  </div>

  <script src="hub.js"></script>
</body>
</html>
