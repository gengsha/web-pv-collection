name: screenshots
# Regenerates screenshots/ and the README gallery. Run manually from the Actions tab,
# or automatically when a preset changes on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web-pv*/presets/**"]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/screenshot.py
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add screenshots README.md
          git diff --cached --quiet || git commit -m "chore: refresh preset screenshots [skip ci]"
          git push
