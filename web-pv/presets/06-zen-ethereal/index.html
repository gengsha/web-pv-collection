<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini | Zen Ethereal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 呼吸光环 -->
  <div class="zen-halo" id="zenHalo"></div>

  <div class="zen-layout">
    <header class="zen-header">
      <div class="zen-logo">双子 · 止水</div>
      <span class="zen-status">心流常驻 · 虚室生白</span>
    </header>

    <main class="zen-main">
      <section class="zen-hero">
        <h1 class="zen-title">风止水静，<br>智识自明。</h1>
        <p class="zen-subtitle">
          去除数字世界的一切喧嚣与杂音。在极简的留白之中，让思维回归最纯粹的本源。
        </p>
      </section>

      <!-- 沉思意象列 -->
      <section class="meditation-grid">
        <div class="ink-card">
          <span class="ink-num">一</span>
          <h3>无念而照</h3>
          <p>不强加预设，在长上下文的宽广虚空中倾听全息意图的自然生长。</p>
        </div>

        <div class="ink-card">
          <span class="ink-num">二</span>
          <h3>顺物自然</h3>
          <p>代码如流水，避高趋下，重构千万行逻辑而不起微澜波澜。</p>
        </div>

        <div class="ink-card">
          <span class="ink-num">三</span>
          <h3>万籁归一</h3>
          <p>声、色、图、文，皆为表象；于寂静处洞见多模态共融之大道。</p>
        </div>
      </section>

      <!-- 纯粹对话流 -->
      <section class="mind-dialogue">
        <div class="dialogue-box">
          <input type="text" id="zenInput" placeholder="输入一句思索，与寂静对话..." autocomplete="off">
          <div class="zen-reply" id="zenReply">
            “心念所至，如月印千江。请在此安歇片刻。”
          </div>
        </div>
      </section>
    </main>

    <footer class="zen-footer">
      <p>Gemini Ethereal Zen · Preset 06</p>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
